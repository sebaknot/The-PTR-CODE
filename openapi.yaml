openapi: 3.1.0
info:
  title: Porter API
  version: 0.2.0
  description: Porter — courier delivery API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: deliveries
    description: Delivery requests and management
  - name: couriers
    description: Courier management and availability (legacy — use porters)
  - name: porters
    description: Porter management and availability
  - name: tracking
    description: Real-time location tracking

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    post:
      operationId: createUser
      tags: [users]
      summary: Create or upsert a user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{deviceId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by device ID
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /deliveries:
    get:
      operationId: listDeliveries
      tags: [deliveries]
      summary: List deliveries (filter by senderId, courierId, or status)
      parameters:
        - name: senderId
          in: query
          schema:
            type: string
        - name: courierId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: List of deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeliveriesResponse"
    post:
      operationId: createDelivery
      tags: [deliveries]
      summary: Create a new delivery request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryBody"
      responses:
        "201":
          description: Delivery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /deliveries/available:
    get:
      operationId: listAvailableDeliveries
      tags: [deliveries]
      summary: List available (pending) deliveries near a location
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radiusKm
          in: query
          schema:
            type: number
            default: 10
      responses:
        "200":
          description: Available deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeliveriesResponse"

  /deliveries/{id}:
    get:
      operationId: getDelivery
      tags: [deliveries]
      summary: Get a delivery by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /deliveries/{id}/accept:
    post:
      operationId: acceptDelivery
      tags: [deliveries]
      summary: Courier accepts a delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptDeliveryBody"
      responses:
        "200":
          description: Delivery accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "409":
          description: Delivery already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /deliveries/{id}/status:
    patch:
      operationId: updateDeliveryStatus
      tags: [deliveries]
      summary: Update delivery status (picked_up, delivered, cancelled)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /couriers/{deviceId}/location:
    patch:
      operationId: updateCourierLocation
      tags: [couriers]
      summary: Update courier's current location
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationBody"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierLocation"

  /couriers/{deviceId}/availability:
    patch:
      operationId: updateCourierAvailability
      tags: [couriers]
      summary: Toggle courier online/offline status
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAvailabilityBody"
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /porters/{porterId}/location:
    patch:
      operationId: updatePorterLocation
      tags: [porters]
      summary: Update porter's current location
      parameters:
        - name: porterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationBody"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierLocation"

  /porters/{porterId}/availability:
    patch:
      operationId: updatePorterAvailability
      tags: [porters]
      summary: Toggle porter online/offline status
      parameters:
        - name: porterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAvailabilityBody"
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /tracking/{deliveryId}:
    get:
      operationId: getDeliveryTracking
      tags: [tracking]
      summary: Get courier's current location for a delivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Courier location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingInfo"
        "404":
          description: Delivery or courier not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DeliveryStatus:
      type: string
      enum:
        - pending
        - accepted
        - picked_up
        - delivered
        - cancelled

    PackageSize:
      type: string
      enum:
        - small
        - medium
        - large
        - extra_large

    UserRole:
      type: string
      enum:
        - sender
        - courier

    User:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        isOnline:
          type: boolean
        currentLat:
          type: number
          nullable: true
        currentLng:
          type: number
          nullable: true
        rating:
          type: number
          nullable: true
        totalDeliveries:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - name
        - phone
        - role
        - isOnline
        - totalDeliveries
        - createdAt
        - updatedAt

    CreateUserBody:
      type: object
      properties:
        deviceId:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
      required:
        - deviceId
        - name
        - phone
        - role

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        isOnline:
          type: boolean

    Delivery:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: string
        courierId:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        packageSize:
          $ref: "#/components/schemas/PackageSize"
        packageDescription:
          type: string
        pickupAddress:
          type: string
        pickupLat:
          type: number
        pickupLng:
          type: number
        dropoffAddress:
          type: string
        dropoffLat:
          type: number
        dropoffLng:
          type: number
        estimatedPrice:
          type: number
        distanceKm:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        pickedUpAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sender:
          $ref: "#/components/schemas/UserSummary"
          nullable: true
        courier:
          $ref: "#/components/schemas/UserSummary"
          nullable: true
      required:
        - id
        - senderId
        - status
        - packageSize
        - packageDescription
        - pickupAddress
        - pickupLat
        - pickupLng
        - dropoffAddress
        - dropoffLat
        - dropoffLng
        - estimatedPrice
        - createdAt
        - updatedAt

    UserSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        rating:
          type: number
          nullable: true
      required:
        - id
        - name
        - phone

    ListDeliveriesResponse:
      type: object
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
      required:
        - deliveries

    CreateDeliveryBody:
      type: object
      properties:
        senderId:
          type: string
        packageSize:
          $ref: "#/components/schemas/PackageSize"
        packageDescription:
          type: string
        pickupAddress:
          type: string
        pickupLat:
          type: number
        pickupLng:
          type: number
        dropoffAddress:
          type: string
        dropoffLat:
          type: number
        dropoffLng:
          type: number
        notes:
          type: string
      required:
        - senderId
        - packageSize
        - packageDescription
        - pickupAddress
        - pickupLat
        - pickupLng
        - dropoffAddress
        - dropoffLat
        - dropoffLng

    AcceptDeliveryBody:
      type: object
      properties:
        courierId:
          type: string
      required:
        - courierId

    UpdateDeliveryStatusBody:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        courierId:
          type: string
      required:
        - status

    UpdateLocationBody:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng

    UpdateAvailabilityBody:
      type: object
      properties:
        isOnline:
          type: boolean
      required:
        - isOnline

    CourierLocation:
      type: object
      properties:
        deviceId:
          type: string
        lat:
          type: number
        lng:
          type: number
        updatedAt:
          type: string
          format: date-time
      required:
        - deviceId
        - lat
        - lng
        - updatedAt

    TrackingInfo:
      type: object
      properties:
        deliveryId:
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        courierLat:
          type: number
          nullable: true
        courierLng:
          type: number
          nullable: true
        courierName:
          type: string
          nullable: true
        lastUpdated:
          type: string
          format: date-time
          nullable: true
      required:
        - deliveryId
        - status
